name: Test

# hyprdown powers machines off, so it only ever runs here, on throwaway runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  fake-compositor:
    name: Fake compositor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make pkg-config libjson-c-dev libsystemd-dev dbus-user-session

      # For the app unit test: apps under uwsm or app2unit run as app-*.scope units.
      - name: Start a user systemd instance
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 100); do [ -S "$runtime/bus" ] && break; sleep 0.2; done
          XDG_RUNTIME_DIR="$runtime" systemctl --user is-system-running --wait || true
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"
          echo "HYPRDOWN_TEST_USER_SYSTEMD=1" >> "$GITHUB_ENV"

      - name: Build
        run: make CFLAGS="-O2 -g -Werror"

      - name: Run tests
        run: python3 -I tests/run_tests.py dist/hyprdown
