name: Test

# hyprdown powers machines off, so it only ever runs here, on throwaway runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  fake-compositor:
    name: Fake compositor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make pkg-config libjson-c-dev libsystemd-dev

      - name: Build
        run: make CFLAGS="-O2 -g -Werror"

      - name: Run tests
        run: python3 -I tests/run_tests.py dist/hyprdown

  real-hyprland:
    name: Real Hyprland (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Hyprland needs a DRM device, which depends on what the runner's kernel offers.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Load virtual DRM modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe vkms
          sudo modprobe vgem
          sudo chmod 666 /dev/dri/*
          ls -l /dev/dri

      - name: Run test in an Arch container
        run: |
          docker run --rm --device /dev/dri -v "$PWD:/src" -w /src archlinux:base-devel bash -euc '
            pacman -Syu --noconfirm hyprland foot mesa vulkan-swrast json-c python ttf-dejavu
            make
            useradd -m tester
            chown -R tester .
            runuser -u tester -- env GITHUB_ACTIONS=true AQ_TRACE=1 LIBGL_ALWAYS_SOFTWARE=1 bash tests/real_hyprland.sh dist/hyprdown
          '
